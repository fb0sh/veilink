name: CI

# Continuous integration for Veilink.
#
# Four gates run on every push and pull request:
#   * formatting, clippy (warnings are errors) and the full test suite;
#   * a release build;
#   * a build matrix for the three supported release targets;
#   * a non-blocking dependency advisory scan.
#
# The cross-compilation matrix mirrors `.github/workflows/release.yml` so that a target cannot be
# released that has never been built in CI.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Formatting
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is checked for the whole workspace, including `benches`.
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Lints
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      # `--all-targets` covers unit tests, integration tests and the benchmark targets.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # The integration tests drive the real `curl` binary through a real proxy.
      - name: Install curl
        run: curl --version
      - run: cargo test --workspace --all-targets
      - name: Documentation tests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # Release build (native, no cross toolchain needed)
  # ---------------------------------------------------------------------------
  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Check the binary reports its version
        run: ./target/release/veilink --version

  # ---------------------------------------------------------------------------
  # Fuzzing (bounded: this is a smoke run, not a full campaign)
  #
  # `cargo fuzz` drives cargo, and cargo resolves its toolchain from the working
  # directory, which is the repository root and therefore stable. The nightly
  # toolchain is selected explicitly instead of relying on `fuzz/rust-toolchain.toml`,
  # which cargo would only consult if it were invoked from inside `fuzz/`.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - frame_read
          - frame_header
          - message_decode
          - rule_parse
          - config_yaml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz

      - run: cargo install cargo-fuzz --locked

      - name: Build the fuzz targets
        run: RUSTUP_TOOLCHAIN=nightly cargo fuzz build ${{ matrix.target }}

      - name: Fuzz ${{ matrix.target }} for 60 seconds
        run: |
          RUSTUP_TOOLCHAIN=nightly cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1

      # A crash leaves an artifact that reproduces the input; upload it so the
      # failure can be investigated rather than merely observed.
      - name: Upload a crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Cross-compilation matrix
  # ---------------------------------------------------------------------------
  cross:
    name: cross ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}
          key: ${{ matrix.target }}

      # Each target is built on its own native runner, so no cross toolchain is needed.
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Dependency advisories (informational: a new advisory must not block a release)
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
