name: CI

# Continuous integration for Veilink.
#
# Four gates run on every push and pull request:
#   * formatting, clippy (warnings are errors) and the full test suite;
#   * a release build;
#   * a cross-compilation matrix for the five supported targets;
#   * a non-blocking dependency advisory scan.
#
# The cross-compilation matrix mirrors `.github/workflows/release.yml` so that a target cannot be
# released that has never been built in CI.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Formatting
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is checked for the whole workspace, including `benches`.
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Lints
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      # `--all-targets` covers unit tests, integration tests and the benchmark targets.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # The integration tests drive the real `curl` binary through a real proxy.
      - name: Install curl
        run: curl --version
      - run: cargo test --workspace --all-targets
      - name: Documentation tests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # Release build (native, no cross toolchain needed)
  # ---------------------------------------------------------------------------
  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Check the binary reports its version
        run: ./target/release/veilink --version

  # ---------------------------------------------------------------------------
  # Cross-compilation matrix
  # ---------------------------------------------------------------------------
  cross:
    name: cross ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure linker
        if: matrix.linker != ''
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          # `ring` (the rustls provider) compiles C, so it needs the cross compiler too.
          echo "CC_aarch64_unknown_linux_gnu=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Dependency advisories (informational: a new advisory must not block a release)
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
