name: Release

# Triggered by a `v*` tag, or manually from the Actions tab.
#
# Builds the three supported targets and publishes one archive per platform:
#
#   veilink-linux-x86_64.tar.gz
#   veilink-macos-aarch64.tar.gz
#   veilink-windows-x86_64.zip
#
# Each archive contains the `veilink` binary, `README.md`, `LICENSE` and the `examples/`
# directory. A `SHA256SUMS` file covering every archive is published alongside them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: veilink

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: veilink-linux-x86_64.tar.gz
            package: tar
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: veilink-macos-aarch64.tar.gz
            package: tar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: veilink-windows-x86_64.zip
            package: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: ${{ matrix.target }}

      # Every target has a native runner, so the build needs no cross toolchain.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p veilink-cli

      # ---------------------------------------------------------------------
      # Stage the archive contents.
      # ---------------------------------------------------------------------
      - name: Stage (Unix)
        if: matrix.package == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/veilink-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$stage/"
          cp README.md LICENSE "$stage/"
          cp -R examples "$stage/examples"
          tar -czf "dist/${{ matrix.archive }}" -C dist "veilink-${{ matrix.target }}"
          rm -rf "$stage"

      - name: Stage (Windows)
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $stage = "dist/veilink-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BINARY_NAME.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item examples $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist/${{ matrix.archive }}" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    # A manual run on a branch builds the archives but never publishes a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum veilink-*.tar.gz veilink-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Collect release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # CHANGELOG headings are unversioned (`## [0.1.0]`) while tags are versioned
          # (`v0.1.0`), so the leading `v` has to come off or nothing matches and every release
          # silently falls back to the stub below.
          version="${tag#v}"
          # Extract the section for this release; fall back to a stub if it is missing.
          awk -v tag="$version" '
            /^## \[/ { if (found) exit; if (index($0, tag)) found = 1 }
            found { print }
          ' CHANGELOG.md > NOTES.md || true
          if [ ! -s NOTES.md ]; then
            printf 'Veilink %s\n\nSee CHANGELOG.md for the full history.\n' "$tag" > NOTES.md
          fi
          cat NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/veilink-*.tar.gz
            dist/veilink-*.zip
            dist/SHA256SUMS
          body_path: NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref_name, '-')
          fail_on_unmatched_files: true
