[workspace]
resolver = "2"
members = [
    "crates/veilink-cli",
    "crates/veilink-config",
    "crates/veilink-rules",
    "crates/veilink-crypto",
    "crates/veilink-protocol",
    "crates/veilink-client",
    "crates/veilink-server",
    "crates/veilink-transport",
    "crates/veilink-privacy",
    "tests",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["The Veilink Contributors"]
repository = "https://github.com/veilink/veilink"
homepage = "https://github.com/veilink/veilink"
keywords = ["proxy", "privacy", "cryptography", "http", "vpn"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
# --- internal ---
veilink-config = { path = "crates/veilink-config", version = "0.1.0" }
veilink-rules = { path = "crates/veilink-rules", version = "0.1.0" }
veilink-crypto = { path = "crates/veilink-crypto", version = "0.1.0" }
veilink-protocol = { path = "crates/veilink-protocol", version = "0.1.0" }
veilink-transport = { path = "crates/veilink-transport", version = "0.1.0" }
veilink-privacy = { path = "crates/veilink-privacy", version = "0.1.0" }
veilink-client = { path = "crates/veilink-client", version = "0.1.0" }
veilink-server = { path = "crates/veilink-server", version = "0.1.0" }

# --- async runtime / io ---
tokio = { version = "1.43", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false }

# --- http ---
httparse = { version = "1.9", default-features = false }
h2 = { version = "0.4", default-features = false }
http = { version = "1.1", default-features = false }

# --- tls ---
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pemfile = { version = "2.1", default-features = false }
rcgen = { version = "0.13", default-features = false }

# --- cryptography (RustCrypto + dalek) ---
aes-gcm = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2.0", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
rand = { version = "0.8", default-features = false }
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.2", default-features = false }

# --- dns ---
hickory-resolver = { version = "0.24", default-features = false }

# --- config / cli / misc ---
clap = { version = "4.5", default-features = false }
serde = { version = "1.0", default-features = false }
serde_yaml_ng = { version = "0.10", default-features = false }
thiserror = { version = "2.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
notify = { version = "7.0", default-features = false }
ipnet = { version = "2.10", default-features = false }
idna = { version = "1.0", default-features = false, features = ["alloc", "std", "compiled_data"] }
arc-swap = { version = "1.7", default-features = false }
base64 = { version = "0.22", default-features = false }
bytes = { version = "1.9", default-features = false }
socket2 = { version = "0.5", default-features = false }

# --- dev ---
criterion = { version = "0.5", default-features = false }
tempfile = { version = "3.14", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
