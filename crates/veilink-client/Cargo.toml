[package]
name = "veilink-client"
description = "Veilink client: local HTTP/HTTPS proxy listener, whitelist routing and Direct/Proxy forwarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
veilink-config = { workspace = true }
veilink-rules = { workspace = true }
veilink-crypto = { workspace = true }
veilink-protocol = { workspace = true }
veilink-transport = { workspace = true }

tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
httparse = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "test-util"] }
tempfile = { workspace = true }
