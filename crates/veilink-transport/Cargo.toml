[package]
name = "veilink-transport"
description = "TLS 1.3 (and HTTP/2) transport for the Veilink protocol, with PSK-bound channel binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
veilink-config = { workspace = true }
veilink-crypto = { workspace = true }
veilink-protocol = { workspace = true }

tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12", "logging"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = { workspace = true, features = ["std"] }
rcgen = { workspace = true, features = ["pem", "crypto", "ring"] }
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tempfile = { workspace = true }
