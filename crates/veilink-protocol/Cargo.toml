[package]
name = "veilink-protocol"
description = "VLP/1: the Veilink framing, multiplexing and stream protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
veilink-crypto = { workspace = true }

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time", "sync", "macros"] }
